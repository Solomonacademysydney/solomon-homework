<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>수업 준비</title>
<!--
  수업 준비 화면 /prep/ — 3단계(2026-10-01): 학생 현황 · 종이 시험 · 커리·학교 자료
  셈은 전부 prep_core.js(시험이 같은 파일을 돌린다). 이 파일은 읽기·쓰기·그리기만.

  ⛔ 지키는 선 (/ts/ 와 같다)
    · 익명 로그인을 하지 않는다 — 홈페이지에서 **원장 로그인**을 한 뒤 이 창을 연다. 원장 uid 가 아니면 잠근다.
    · 통째로 읽지 않는다 — 학생·주차 단위로 좁혀 읽는다.
    · 옛 숙제 칸(homeworkSets)·제출(submissions)에 **쓰지 않는다.** 쓰는 곳은 sol_prep_v1 · weakness(종이 시험 기여분)뿐.
    · 학교 자료는 비공개 저장소(Firebase Storage `prep/…`)에만 — 공개 링크를 만들지 않는다.
-->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="prep_core.js"></script>
<style>
:root{ --바탕:#f7f7f9; --판:#fff; --글:#1c1c1e; --흐린글:#6b6b70; --선:#e3e3e8; --짙은파랑:#2b4c7e; --파랑:#3a6ea5;
  --녹색:#2e7d5b; --주황:#b26a00; --빨강:#b3261e; --보라:#5b21b6; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --바탕:#17171a; --판:#202024; --글:#eceff4; --흐린글:#a0a0a8;
  --선:#33333a; --짙은파랑:#9ec1ee; --파랑:#7aa9dd; --녹색:#6fd3a5; --주황:#e0a44a; --빨강:#f2837a; --보라:#c4b5fd; } }
:root[data-theme="dark"]{ --바탕:#17171a; --판:#202024; --글:#eceff4; --흐린글:#a0a0a8; --선:#33333a; --짙은파랑:#9ec1ee;
  --파랑:#7aa9dd; --녹색:#6fd3a5; --주황:#e0a44a; --빨강:#f2837a; --보라:#c4b5fd; }
*{box-sizing:border-box} body{margin:0;background:var(--바탕);color:var(--글);font:14px/1.5 "Noto Sans KR",system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--판);border-bottom:1px solid var(--선)}
header h1{font-size:18px;margin:0}
.딱지{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--선)} .좋음{color:var(--녹색)} .나쁨{color:var(--빨강)}
main{display:grid;grid-template-columns:260px 1fr;gap:12px;padding:12px 16px} @media(max-width:760px){main{grid-template-columns:1fr}}
.판{background:var(--판);border:1px solid var(--선);border-radius:10px;padding:12px}
#학생목록 button{display:block;width:100%;text-align:left;margin:0 0 6px;padding:8px 10px;border:1px solid var(--선);border-radius:8px;background:var(--판);color:var(--글);cursor:pointer}
#학생목록 button.고름{border-color:var(--파랑);outline:2px solid var(--파랑)} .작게{font-size:12px;color:var(--흐린글)}
.탭{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap} .탭 button{padding:6px 12px;border-radius:8px;border:1px solid var(--선);background:var(--판);color:var(--글);cursor:pointer}
.탭 button.고름{background:var(--짙은파랑);color:#fff}
table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid var(--선);padding:5px 6px;text-align:left;font-size:13px;vertical-align:top}
input,select,textarea{font:inherit;padding:5px 7px;border:1px solid var(--선);border-radius:6px;background:var(--판);color:var(--글)}
button.주{padding:6px 12px;border-radius:8px;border:none;background:var(--짙은파랑);color:#fff;cursor:pointer} button:disabled{opacity:.5;cursor:not-allowed}
.경고{color:var(--주황);font-weight:700} .빨강{color:var(--빨강);font-weight:700} .보라{color:var(--보라);font-weight:700}
#잠금막{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center}
#잠금막.보임{display:flex} #잠금막 div{background:var(--판);padding:24px;border-radius:12px;max-width:520px}
#알림{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:60}
.섹{margin-bottom:14px} .섹 h3{margin:0 0 6px;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>📋 수업 준비</h1>
  <span id="누구" class="딱지 나쁨">확인 중</span>
  <label class="작게">기준 날짜 <input type="date" id="기준날짜" onchange="다시그리기()"></label>
  <span class="작게" id="읽은수"></span>
</header>
<div id="잠금막"><div><b>🔒 잠김</b><p id="잠금말"></p><p class="작게">홈페이지에서 원장 로그인 → 이 창을 새로 고치십시오.</p></div></div>
<main>
  <section class="판"><div class="작게" style="margin-bottom:6px">내일 수업 학생이 먼저</div><div id="학생목록">불러오는 중…</div></section>
  <section class="판" id="카드"><div class="작게">왼쪽에서 학생을 고르세요.</div></section>
</main>
<div id="알림"></div>
<script>
'use strict';
const C = window.PrepCore;
// ── 운영 설정 + 시험 환경 스위치(학생 화면과 같은 규칙: localhost·127.0.0.1 + ?emu=1 만) ──
const 운영설정 = { apiKey: "AIzaSyDvj7CDHZ7_Wci0palB9KpbjvCUkvcCRZY", authDomain: "solomon-76715.firebaseapp.com",
  databaseURL: "https://solomon-76715-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "solomon-76715", storageBucket: "solomon-76715.appspot.com" };
function _emuModeOf(loc) {
  const h = String((loc && loc.hostname) || '');
  if (h !== 'localhost' && h !== '127.0.0.1') return false;
  return /[?&]emu=1(&|$)/.test(String((loc && loc.search) || ''));
}
const _EMU = _emuModeOf(location);
firebase.initializeApp(_EMU ? { apiKey: 'demo-key', authDomain: 'demo-solomon.firebaseapp.com', databaseURL: 'http://127.0.0.1:9000?ns=demo-solomon',
  projectId: 'demo-solomon', storageBucket: 'demo-solomon.appspot.com' } : 운영설정);
if (_EMU) {
  firebase.database().useEmulator('127.0.0.1', 9000); firebase.auth().useEmulator('http://127.0.0.1:9099');
  firebase.storage().useEmulator('127.0.0.1', 9199); document.title = '[시험] ' + document.title;
  document.addEventListener('DOMContentLoaded', () => { const b = document.createElement('div'); b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#7c2d12;color:#fff;text-align:center;padding:8px;font-weight:900;z-index:99;pointer-events:none'; b.textContent = '🧪 시험 환경 (에뮬레이터) — 운영 자료가 아닙니다'; document.body.appendChild(b); });
}
const OPERATOR_UID = '62bxWubzDLMrhHjjv2oNfAQiyaD2';   // index.html 과 같아야 한다
const db = firebase.database();
const 뿌리 = 'solomon_hw_v3', 새뿌리 = 'sol_prep_v1';

let 잠겼나 = true, 읽은경로 = 0;
const 판 = { users: [], attendance: {}, attendanceDays: {}, releases: {}, prepSubs: {}, paperTests: {}, 차례: [] };
let 고른 = null, 고른탭 = '현황', 아이자료 = null;

function 알림(말) { const a = document.getElementById('알림'); a.textContent = 말; a.style.display = 'block'; clearTimeout(알림.t); 알림.t = setTimeout(() => a.style.display = 'none', 3500); }
function 글(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function 읽기(경로, q) {
  읽은경로++; document.getElementById('읽은수').textContent = '읽은 경로 ' + 읽은경로;
  try { const s = await (q ? q(db.ref(경로)) : db.ref(경로)).get(); return s.exists() ? s.val() : null; }
  catch (e) { console.warn('[읽기 실패]', 경로, e.code || e.message); return null; }
}
function 오늘() {
  const v = document.getElementById('기준날짜').value;
  return v ? C.parseYmd(v) : new Date(new Date().toLocaleString('en-US', { timeZone: 'Australia/Sydney' }));
}

// ── 원장 문지기 — 계속 지켜보다가 바뀌면 잠근다 ──
function 잠그기(말) { 잠겼나 = true; document.getElementById('잠금막').classList.add('보임'); document.getElementById('잠금말').textContent = 말;
  const n = document.getElementById('누구'); n.textContent = '잠김'; n.className = '딱지 나쁨'; }
firebase.auth().onAuthStateChanged(u => {
  if (!u) return 잠그기('로그인돼 있지 않습니다.');
  if (u.isAnonymous || u.uid !== OPERATOR_UID) return 잠그기(u.isAnonymous ? '이 브라우저는 익명(학생 화면)으로 로그인돼 있습니다.' : '원장 계정이 아닙니다.');
  잠겼나 = false; document.getElementById('잠금막').classList.remove('보임');
  const n = document.getElementById('누구'); n.textContent = '원장님'; n.className = '딱지 좋음';
  첫판();
});

async function 첫판() {
  document.getElementById('기준날짜').value = document.getElementById('기준날짜').value || C.ymd(오늘());
  const [users, att, attDays, rel, sub, tests] = await Promise.all([
    읽기(뿌리 + '/users'), 읽기(뿌리 + '/attendance'), 읽기(뿌리 + '/attendance_days'),
    읽기(새뿌리 + '/releases'), 읽기(새뿌리 + '/submissions'), 읽기(새뿌리 + '/paperTests')]);
  const 목록 = Array.isArray(users) ? users : Object.values(users || {});
  판.users = 목록.filter(u => u && u.role === 'student' && u.status !== 'inactive' && !u.isTest);
  판.attendance = att || {}; 판.attendanceDays = attDays || {}; 판.releases = rel || {}; 판.prepSubs = sub || {}; 판.paperTests = tests || {};
  목록그리기();
}
function 다시그리기() { 목록그리기(); if (고른) 아이고르기(고른); }
function 목록그리기() {
  판.차례 = C.orderStudents(판.users, 판.attendanceDays, 오늘());
  document.getElementById('학생목록').innerHTML = 판.차례.map(x =>
    `<button class="${x.user.id === 고른 ? '고름' : ''}" onclick="아이고르기('${글(x.user.id)}')">${x.tomorrow ? '🔔 ' : ''}<b>${글(x.user.name || x.user.id)}</b>
      <span class="작게">Y${글(x.user.year)} · ${x.days.map(d => C.요일말[d]).join('') || '요일?'}${x.nextClass ? ' · 다음 ' + x.nextClass.slice(5) : ''}</span></button>`).join('')
    || '<div class="작게">학생이 없습니다.</div>';
}

// ── 한 학생 자료 — 좁혀서 읽는다 ──
async function 아이고르기(sid) {
  고른 = sid; 목록그리기();
  const u = 판.users.find(x => x.id === sid); if (!u) return;
  const win = C.analysisWindow(u, 판.attendance, 판.attendanceDays, 오늘());
  const periods = C.periodsInWindow(win);
  const 열쇠들 = new Set();
  periods.forEach(p => { 열쇠들.add(C.hwKey(u.year, u.country || 'AU', p, u.group || '')); if (u.group) 열쇠들.add(C.hwKey(u.year, u.country || 'AU', p, '')); });
  const hw = {};
  await Promise.all(Array.from(열쇠들).map(async k => { const v = await 읽기(뿌리 + '/homeworkSets/' + k); if (v) hw[k] = v; }));
  const 범위 = (앞) => (r) => r.orderByKey().startAt(앞).endAt(앞 + '');
  const [mr, ts, weak, prof, curs, srcs, results, drafts] = await Promise.all([
    읽기(뿌리 + '/submissions', 범위(sid + '_')), 읽기(뿌리 + '/submissions', 범위('ts_' + sid + '_')), 읽기(뿌리 + '/weakness/' + sid),
    읽기(새뿌리 + '/students/' + sid + '/profile'), 읽기(새뿌리 + '/students/' + sid + '/curricula'), 읽기(새뿌리 + '/students/' + sid + '/sources'),
    읽기(새뿌리 + '/paperResults/' + sid), 읽기(새뿌리 + '/drafts')]);
  const submissions = Object.assign({}, mr || {}, ts || {});
  const 분석 = C.analyzeHomework({ user: u, periods, homeworkSets: hw, submissions, releases: 판.releases, prepSubs: 판.prepSubs, normAns: C.normAns });
  아이자료 = { u, win, periods, 분석, weak: weak || {}, profile: prof || {}, curricula: curs || {}, sources: srcs || {}, results: results || {}, drafts: drafts || {} };
  카드그리기();
}

function 카드그리기() {
  const a = 아이자료; if (!a) return;
  const 탭 = ['현황', '종이 시험', '커리·학교 자료'].map(t => `<button class="${t === 고른탭 ? '고름' : ''}" onclick="고른탭='${t}';카드그리기()">${t}</button>`).join('');
  const 검토 = C.needsCurriculumReview(a.sources);
  let 몸 = '';
  if (고른탭 === '현황') 몸 = 현황그리기(a);
  else if (고른탭 === '종이 시험') 몸 = 시험그리기(a);
  else 몸 = 커리그리기(a);
  document.getElementById('카드').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0">${글(a.u.name || a.u.id)} <span class="작게">Y${글(a.u.year)} ${글(a.u.group || '')}</span></h2>
      ${검토 ? '<span class="경고" id="커리검토">⚠️ 커리 먼저 검토 — 관련 제작 보류</span>' : ''}</div>
    <div class="탭">${탭}</div>${몸}`;
}

// ── 현황 ──
function 현황그리기(a) {
  const w = a.win;
  const 지난주 = w.lastClass
    ? `직전 수업 <b>${w.lastClass}</b>${w.status === 'absent' ? ' <span class="빨강">(결석)</span>' : ''}${w.source === 'weekday' ? ' <span class="작게">(출석 기록 없음 — 요일로 짐작)</span>' : ''} · 분석 기간 <b>${w.from} ~ ${w.to}</b>`
    : '수업 기록이 없습니다';
  const 줄 = a.분석.weeks.map(wk => {
    const 머리 = `<tr><th colspan="7">${C.periodKey(wk.period)} · ${({ personal: '📌 개인 숙제', group: '그룹 숙제', pending: '⏳ 준비 중(비공개)', none: '숙제 없음' })[wk.kind]}${wk.ref ? ' <span class="작게">' + 글(wk.ref) + '</span>' : ''}</th></tr>`;
    const 세트 = wk.sets.map(s => `<tr><td>${글(s.title)}</td><td>${s.manual ? '<span class="보라">원장 처리</span>' : s.submitted ? '✅' : '—'}</td>
      <td>${s.submittedAt ? 글(String(s.submittedAt).slice(0, 16).replace('T', ' ')) : ''}</td><td>${s.score == null ? '' : s.score + '%'}</td>
      <td>${s.correct == null ? '' : s.correct + '/' + s.total}</td><td>${s.unanswered == null ? '' : '미답 ' + s.unanswered}</td><td class="작게">${s.manual ? 글(s.markedReason) : ''}</td></tr>`).join('');
    const ts = wk.ts ? `<tr><td colspan="7" class="작게">🧠 TS ${wk.ts.done}/${wk.ts.days}일 · 첫 시도 ${wk.ts.firstTryRate == null ? '-' : wk.ts.firstTryRate + '%'} · 힌트 ${wk.ts.hintRate == null ? '-' : wk.ts.hintRate + '%'} (${wk.ts.questions}문항)</td></tr>` : '';
    return 머리 + 세트 + ts;
  }).join('');
  const t = a.분석.totals;
  const 약 = C.weakTop(a.weak, 3, 2).map(x => `<li>${글(x.taxId)} — ${x.accuracy}% (${x.correct}/${x.attempts})</li>`).join('') || '<li class="작게">아직 기록이 적습니다</li>';
  const 시험 = Object.keys(a.results).map(tid => ({ tid, r: a.results[tid] })).sort((x, y) => String(y.tid).localeCompare(String(x.tid))).slice(0, 3)
    .map(({ tid, r }) => `<li>${글((판.paperTests[tid] || {}).title || tid)} — ${r.current.status === 'absent' ? '<span class="작게">미응시</span>' : r.current.percent + '% (' + r.current.score + '/' + r.current.max + ')'}${r.current.rev > 1 ? ' <span class="작게">수정 ' + (r.current.rev - 1) + '번</span>' : ''}</li>`).join('') || '<li class="작게">없음</li>';
  const 커리 = 현재커리(a);
  const 무효 = C.staleDrafts(a.drafts, a.u.id, a.profile.currentCurriculum);
  const 제작 = Object.keys(a.drafts).filter(k => a.drafts[k] && a.drafts[k].studentId === a.u.id);
  return `<div class="섹"><h3>지난주</h3>${지난주}</div>
    <div class="섹"><h3>지난 숙제 <span class="작게">세트 ${t.sets} · 제출 ${t.submitted}${t.manual ? ' (원장 처리 ' + t.manual + ')' : ''} · 평균 ${t.avgScore == null ? '-' : t.avgScore + '%'} · 미답 ${t.unanswered}</span></h3>
      <table>${줄 || '<tr><td class="작게">숙제 없음</td></tr>'}</table></div>
    <div class="섹"><h3>약점</h3><ul>${약}</ul></div>
    <div class="섹"><h3>지난 시험</h3><ul>${시험}</ul></div>
    <div class="섹"><h3>현재 커리</h3>${커리 ? `<b>${글(a.profile.currentCurriculum)}</b> · 시험 ${글((커리.long || {}).targetExamDate || '')} · 범위 ${글((커리.short || {}).confirmedRange || '-')}` : '<span class="작게">없음</span>'}</div>
    <div class="섹"><h3>제작 상태</h3>${제작.length ? 제작.map(k => `${글(k)}${무효.includes(k) ? ' <span class="경고">(옛 커리 — 무효)</span>' : ''}`).join(' · ') : '<span class="작게">제작 중인 것 없음</span>'}</div>`;
}
function 현재커리(a) { const r = a.profile.currentCurriculum; return r ? a.curricula[r] || null : null; }

// ── 종이 시험 ──
let 명세편집 = null;   // { testId, title, date, items:[] }
function 시험그리기(a) {
  const 목록 = Object.keys(판.paperTests).sort().reverse();
  const 고른시험 = 시험그리기.고른 && 판.paperTests[시험그리기.고른] ? 판.paperTests[시험그리기.고른] : null;
  const 편집 = 명세편집 ? 명세편집그리기() : '<button class="주" onclick="새명세()">＋ 새 시험 명세</button>';
  let 입력 = '';
