<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>분수 피자집 · Fraction Pizzeria</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #FEFAE0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 30px;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(224,90,58,0.10) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(224,90,58,0.10) 0%, transparent 45%);
    }

    .header { text-align: center; margin-bottom: 14px; }
    .title {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 900;
      color: #9C2F1B;
      letter-spacing: -0.5px;
    }
    .title-en { font-size: 0.95rem; color: #C4705C; margin-top: 2px; font-weight: 700; letter-spacing: 1px; }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 18px;
      background: white;
      border-radius: 20px;
      padding: 9px 22px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(224,90,58,0.18);
      border: 2px solid #F8DAD2;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat { display: flex; align-items: center; gap: 6px; font-size: 1.05rem; font-weight: 800; color: #9C2F1B; }
    .stat-icon { font-size: 1.15rem; }

    .stage-wrap { position: relative; }
    .stage {
      position: relative;
      width: min(92vw, 720px);
      min-height: 540px;
      background: linear-gradient(180deg, #FFE9E2 0%, #FFF8F5 100%);
      border: 3px solid #EFA68F;
      border-radius: 22px;
      box-shadow: 0 8px 28px rgba(224,90,58,0.25);
      padding: 18px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .question {
      font-size: 1.15rem;
      font-weight: 900;
      color: #9C2F1B;
      text-align: center;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .question .en { font-size: 0.88rem; font-weight: 700; color: #C4705C; }
    .frac { display: inline-block; font-size: 1.35rem; color: #E05A3A; }

    .order-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      border: 2.5px solid #F2C0B0;
      border-radius: 18px;
      padding: 8px 22px;
      margin-bottom: 12px;
      font-size: 1.15rem;
      font-weight: 900;
      color: #9C2F1B;
      box-shadow: 0 3px 10px rgba(156,47,27,0.10);
    }
    .order-card .frac { font-size: 1.5rem; }

    #pizza-box { margin-bottom: 12px; }
    .pizza-row { display: flex; gap: 26px; align-items: center; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
    .pizza-pick { cursor: pointer; border-radius: 50%; transition: transform 0.12s; text-align: center; }
    .pizza-pick:hover { transform: scale(1.04); }
    .pizza-pick.right { outline: 5px solid #7EC850; outline-offset: 4px; }
    .pizza-pick.wrong { outline: 5px solid #F08080; outline-offset: 4px; }
    .pizza-label { font-size: 1.3rem; font-weight: 900; color: #9C2F1B; margin-top: 6px; }

    .btn-grid { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
    .ans-btn {
      min-width: 74px;
      padding: 12px 16px;
      background: white;
      border: 2.5px solid #EFA68F;
      border-radius: 16px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      color: #9C2F1B;
      cursor: pointer;
      transition: all 0.12s;
      touch-action: manipulation;
    }
    .ans-btn:hover { background: #FFEFE9; }
    .ans-btn:disabled { cursor: default; }
    .ans-btn.right { background: #7EC850; border-color: #4F9030; color: white; }
    .ans-btn.wrong { background: #F08080; border-color: #C0392B; color: white; animation: shake 0.3s; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .serve-btn {
      padding: 11px 34px;
      background: #E05A3A;
      color: white;
      border: none;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 #A83A20;
      transition: all 0.12s;
    }
    .serve-btn:hover  { background: #C94E30; }
    .serve-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #A83A20; }

    .feedback { min-height: 44px; text-align: center; font-weight: 900; font-size: 1.1rem; margin-top: 4px; }
    .feedback .ok { color: #3D6B26; }
    .feedback .no { color: #C0392B; }
    .hint { font-size: 0.9rem; font-weight: 800; color: #C4705C; margin-top: 4px; }

    /* ── Overlay ── */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 248, 245, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: 19px;
      padding: 20px;
      text-align: center;
    }
    .overlay.hidden { display: none; }
    .ov-emoji { font-size: 3.2rem; margin-bottom: 8px; }
    .ov-title { font-size: 1.9rem; font-weight: 900; color: #9C2F1B; margin-bottom: 2px; }
    .ov-title-en { font-size: 1.05rem; font-weight: 800; color: #C4705C; margin-bottom: 8px; letter-spacing: 0.5px; }
    .ov-desc  { font-size: 1rem; font-weight: 700; color: #C4705C; margin-bottom: 16px; line-height: 1.55; }
    .ov-label { font-size: 0.82rem; font-weight: 800; color: #C4705C; letter-spacing: 1px; margin-bottom: 8px; }

    .pick-grid { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
    .pick-btn {
      padding: 9px 18px;
      border: 2.5px solid #EFA68F;
      background: white;
      color: #9C2F1B;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.13s;
    }
    .pick-btn:hover  { background: #FFEFE9; }
    .pick-btn.active { background: #E05A3A; color: white; border-color: #E05A3A; }

    .big-btn {
      padding: 13px 42px;
      background: #7EC850;
      color: white;
      border: none;
      border-radius: 18px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #4F9030;
      transition: all 0.12s;
    }
    .big-btn:hover  { background: #6DB840; transform: translateY(-1px); }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4F9030; }

    .record-badge {
      display: none;
      background: #FFF4D6;
      color: #E8850C;
      border: 2px solid #F5C36A;
      border-radius: 20px;
      padding: 5px 18px;
      font-size: 1rem;
      font-weight: 900;
      margin-bottom: 12px;
    }
    .record-badge.show { display: inline-block; animation: badgePop 0.5s cubic-bezier(.34,1.56,.64,1); }
    @keyframes badgePop {
      0%   { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }

    .result-box {
      background: white;
      border: 2.5px solid #F8DAD2;
      border-radius: 18px;
      padding: 14px 30px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(224,90,58,0.15);
    }
    .result-row { display: flex; justify-content: space-between; gap: 30px; font-size: 1.1rem; font-weight: 800; color: #9C2F1B; padding: 3px 0; }
    .result-row span:last-child { color: #E8850C; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">분수 피자집</div>
    <div class="title-en">Fraction Pizzeria</div>
  </div>

  <div class="stats-bar">
    <div class="stat"><span class="stat-icon">⭐</span><span id="score">0</span></div>
    <div class="stat"><span class="stat-icon">🧾</span><span id="round">1</span>/10</div>
    <div class="stat"><span class="stat-icon">✅</span><span id="correct">0</span></div>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div id="round-area" style="display:flex;flex-direction:column;align-items:center;width:100%;"></div>

      <!-- Start overlay -->
      <div class="overlay" id="start-overlay">
        <div class="ov-emoji">🍕</div>
        <div class="ov-title">분수 피자집</div>
        <div class="ov-title-en">Fraction Pizzeria</div>
        <div class="ov-desc">주문받은 분수만큼 피자를 잘라 서빙하세요<br>Cut and serve pizza by fractions</div>
        <div class="ov-label">놀이 방법 · Mode</div>
        <div class="pick-grid" id="mode-grid">
          <button class="pick-btn active" data-mode="serve">주문 서빙 Serve</button>
          <button class="pick-btn" data-mode="compare">크기 비교 Compare</button>
          <button class="pick-btn" data-mode="match">같은 분수 Match</button>
        </div>
        <div class="ov-label">난이도 · Level</div>
        <div class="pick-grid" id="level-grid">
          <button class="pick-btn active" data-level="easy">쉬움 Easy</button>
          <button class="pick-btn" data-level="hard">어려움 Hard</button>
        </div>
        <button class="big-btn" id="start-btn">시작 · Start</button>
      </div>

      <!-- End overlay -->
      <div class="overlay hidden" id="over-overlay">
        <div class="ov-emoji" id="over-emoji">🍕</div>
        <div class="ov-title" id="over-title">영업 끝!</div>
        <div class="ov-title-en" id="over-title-en">Closing Time</div>
        <div class="record-badge" id="record-badge">신기록! New Record!</div>
        <div class="result-box">
          <div class="result-row"><span>모드 · Mode</span><span id="final-mode"></span></div>
          <div class="result-row"><span>점수 · Score</span><span id="final-score">0</span></div>
          <div class="result-row"><span>맞힌 문제 · Correct</span><span id="final-correct">0</span></div>
          <div class="result-row"><span>내 최고 기록 · Best</span><span id="final-best">0</span></div>
          <div class="result-row"><span>누적 맞힌 문제 · Total</span><span id="final-total">0</span></div>
        </div>
        <button class="big-btn" id="retry-btn">다시 하기 · Retry 🔄</button>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const roundArea = document.getElementById('round-area');
  const startOverlay = document.getElementById('start-overlay');
  const overOverlay  = document.getElementById('over-overlay');

  const TOTAL_ROUNDS = 10;
  const irnd = n => Math.floor(Math.random() * n);
  const pick = arr => arr[irnd(arr.length)];
  const fracHtml = (n, d) => `<span class="frac">${n}/${d}</span>`;

  /* ── 사운드 ── */
  let audioCtx = null;
  function beep(freq, dur, type = 'sine', gain = 0.15) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(gain, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* 무시 */ }
  }
  const sndOk = () => { beep(660, 0.12, 'triangle'); beep(990, 0.18, 'triangle', 0.1); };
  const sndNo = () => beep(220, 0.2, 'square', 0.08);
  const sndCut = () => beep(880, 0.07, 'triangle', 0.08);

  /* ── 기록 저장 ── */
  const STORE_KEY = 'pizzaStats';
  function loadStats() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveStats(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* 무시 */ }
  }

  /* ── 상태 ── */
  let mode = 'serve', level = 'easy';
  let round = 0, score = 0, correctCount = 0;

  const MODE_LABEL  = { serve: '주문 서빙 Serve', compare: '크기 비교 Compare', match: '같은 분수 Match' };
  const LEVEL_LABEL = { easy: '쉬움', hard: '어려움' };

  document.querySelectorAll('#mode-grid .pick-btn').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('#mode-grid .pick-btn').forEach(x => x.classList.toggle('active', x === b));
  }));
  document.querySelectorAll('#level-grid .pick-btn').forEach(b => b.addEventListener('click', () => {
    level = b.dataset.level;
    document.querySelectorAll('#level-grid .pick-btn').forEach(x => x.classList.toggle('active', x === b));
  }));

  /* ── 피자 SVG (d조각, selected 집합 색칠) ── */
  function pizzaSvg(d, selected, size, idPrefix) {
    const cx = 100, cy = 100, r = 88;
    let slices = '';
    if (d === 1) {
      slices = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#F7D154" stroke="#C98A1B" stroke-width="3" data-slice="0" style="cursor:pointer;"/>`;
    } else {
      for (let i = 0; i < d; i++) {
        const a0 = (i * 360 / d - 90) * Math.PI / 180;
        const a1 = ((i + 1) * 360 / d - 90) * Math.PI / 180;
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const large = 360 / d > 180 ? 1 : 0;
        const fill = selected && selected.has(i) ? '#E05A3A' : '#F7D154';
        slices += `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z"
          fill="${fill}" stroke="#C98A1B" stroke-width="2.5" data-slice="${i}" style="cursor:pointer;"/>`;
      }
    }
    return `<svg id="${idPrefix || 'pz'}" width="${size}" height="${size}" viewBox="0 0 200 200">
      <circle cx="${cx}" cy="${cy}" r="${r + 6}" fill="#C98A1B"/>
      ${slices}
    </svg>`;
  }

  /* ── 분수 유틸 ── */
  const gcd = (a, b) => b ? gcd(b, a % b) : a;
  const sameVal = (a, b) => a[0] * b[1] === b[0] * a[1];

  function randFrac() {
    const d = level === 'easy' ? pick([2, 3, 4]) : pick([3, 4, 5, 6, 8, 10, 12]);
    const n = 1 + irnd(d - 1);
    return [n, d];
  }

  /* ── 라운드 ── */
  function renderRound() {
    if (mode === 'serve')   renderServe();
    if (mode === 'compare') renderCompare();
    if (mode === 'match')   renderMatch();
  }

  function updateStats() {
    document.getElementById('score').textContent = score;
    document.getElementById('correct').textContent = correctCount;
  }

  function finishRound(ok, gain) {
    if (ok) { score += gain; correctCount++; sndOk(); }
    else sndNo();
    updateStats();
    setTimeout(nextRound, 1500);
  }

  function nextRound() {
    round++;
    if (round >= TOTAL_ROUNDS) { gameOver(); return; }
    document.getElementById('round').textContent = round + 1;
    renderRound();
  }

  /* ══ 모드 1: 주문 서빙 ══ */
  function renderServe() {
    const [n, d] = (() => {
      const dd = level === 'easy' ? pick([2, 3, 4]) : pick([5, 6, 8, 10, 12]);
      return [1 + irnd(dd - 1), dd];
    })();
    let mistakes = 0;
    let phase = 'cut';           // cut → pick
    let served = false;          // 맞게 서빙한 뒤엔 더 안 받는다(두 번 누르면 점수가 두 번 들어갔다)
    const selected = new Set();

    // 자르기 선택지: 정답 + 3개
    const cutPool = [2, 3, 4, 5, 6, 8, 10, 12].filter(x => x !== d);
    const cuts = [d, ...cutPool.sort(() => Math.random() - 0.5).slice(0, 3)].sort((a, b) => a - b);

    function draw() {
      const q = phase === 'cut'
        ? `피자를 몇 조각으로 잘라야 할까요?<br><span class="en">How many equal slices?</span>`
        : `${n}조각을 골라 담으세요! (${d}조각 중)<br><span class="en">Tap ${n} slice${n > 1 ? 's' : ''}</span>`;
      roundArea.innerHTML = `
        <div class="order-card">🧑‍🍳 주문 Order: ${fracHtml(n, d)} 판 주세요!</div>
        <div class="question">${q}</div>
        <div id="pizza-box">${pizzaSvg(phase === 'cut' ? 1 : d, selected, 210)}</div>
        ${phase === 'cut'
          ? `<div class="btn-grid">${cuts.map(c => `<button class="ans-btn" data-c="${c}">${c}조각</button>`).join('')}</div>`
          : `<button class="serve-btn" id="serve-btn">서빙하기 Serve! 🛎️</button>`}
        <div class="feedback" id="feedback"></div>`;

      if (phase === 'cut') {
        roundArea.querySelectorAll('.ans-btn').forEach(b => b.addEventListener('click', () => {
          const c = parseInt(b.dataset.c, 10);
          if (c === d) {
            sndCut();
            phase = 'pick';
            draw();
          } else {
            mistakes++;
            sndNo();
            b.classList.add('wrong');
            document.getElementById('feedback').innerHTML =
              `<div class="no">다시 생각해보세요!</div><div class="hint">분모(아래 수)가 조각 수예요 · The bottom number tells the slices</div>`;
            setTimeout(() => b.classList.remove('wrong'), 500);
          }
        }));
      } else {
        roundArea.querySelectorAll('[data-slice]').forEach(p => p.addEventListener('click', () => {
          if (served) return;
          const i = parseInt(p.dataset.slice, 10);
          if (selected.has(i)) selected.delete(i); else selected.add(i);
          sndCut();
          document.getElementById('pizza-box').innerHTML = pizzaSvg(d, selected, 210);
          bindSlices();
        }));
        document.getElementById('serve-btn').addEventListener('click', () => {
          if (served) return;
          if (selected.size === n) {
            served = true;
            document.getElementById('serve-btn').disabled = true;
            const gain = mistakes === 0 ? 10 : 5;
            document.getElementById('feedback').innerHTML =
              `<div class="ok">✅ 주문 완료! +${gain} · Perfect serve!</div>`;
            finishRound(true, gain);
          } else {
            mistakes++;
            sndNo();
            document.getElementById('feedback').innerHTML =
              `<div class="no">지금 ${selected.size}조각이에요. ${n}조각을 담아야 해요!</div>
               <div class="hint">분자(위 수)가 담을 조각 수예요 · The top number tells how many</div>`;
          }
        });
      }
    }

    // 조각 클릭을 다시 바인딩 (SVG를 갈아끼우므로)
    function bindSlices() {
      roundArea.querySelectorAll('[data-slice]').forEach(p => p.addEventListener('click', () => {
        if (served) return;
        const i = parseInt(p.dataset.slice, 10);
        if (selected.has(i)) selected.delete(i); else selected.add(i);
        sndCut();
        document.getElementById('pizza-box').innerHTML = pizzaSvg(d, selected, 210);
        bindSlices();
      }));
    }

    draw();
  }

  /* ══ 모드 2: 크기 비교 ══ */
  function renderCompare() {
    let A = randFrac(), B = randFrac();
    if (Math.random() < 0.2) {
      // 20%: 같은 크기 (동치분수 쌍)
      const k = pick([2, 3]);
      B = [A[0] * k, A[1] * k];
      if (B[1] > 12) B = [A[0], A[1]];
    } else {
      let guard = 0;
      while (sameVal(A, B) && guard++ < 20) B = randFrac();
    }
    const equal = sameVal(A, B);
    let judged = false;

    function judgeSel(sel) {
      if (judged) return;
      judged = true;
      const correct = equal ? 'eq' : (A[0] * B[1] > B[0] * A[1] ? 'A' : 'B');
      const pa = document.getElementById('pz-A').parentElement;
      const pb = document.getElementById('pz-B').parentElement;
      const eqBtn = document.getElementById('eq-btn');
      [pa, pb].forEach(x => x.style.pointerEvents = 'none');
      eqBtn.disabled = true;

      if (correct === 'A') pa.classList.add('right');
      if (correct === 'B') pb.classList.add('right');
      if (correct === 'eq') eqBtn.classList.add('right');

      const ok = sel === correct;
      if (!ok) {
        if (sel === 'A') pa.classList.add('wrong');
        if (sel === 'B') pb.classList.add('wrong');
        if (sel === 'eq') eqBtn.classList.add('wrong');
      }
      document.getElementById('feedback').innerHTML = ok
        ? `<div class="ok">✅ 정답! +10</div>`
        : `<div class="no">❌ ${correct === 'eq' ? '두 피자는 같은 크기예요!' : (correct === 'A' ? '왼쪽' : '오른쪽') + ' 피자가 더 커요!'}</div>`;
      finishRound(ok, 10);
    }

    const selSet = f => new Set(Array.from({ length: f[0] }, (_, i) => i));
    roundArea.innerHTML = `
      <div class="question">색칠한 부분이 더 큰 피자를 고르세요!<br><span class="en">Tap the bigger fraction — or Equal!</span></div>
      <div class="pizza-row">
        <div class="pizza-pick" id="pick-A">${pizzaSvg(A[1], selSet(A), 165, 'pz-A')}<div class="pizza-label">${A[0]}/${A[1]}</div></div>
        <div class="pizza-pick" id="pick-B">${pizzaSvg(B[1], selSet(B), 165, 'pz-B')}<div class="pizza-label">${B[0]}/${B[1]}</div></div>
      </div>
      <div class="btn-grid"><button class="ans-btn" id="eq-btn">같아요 Equal =</button></div>
      <div class="feedback" id="feedback"></div>`;

    document.getElementById('pick-A').addEventListener('click', () => judgeSel('A'));
    document.getElementById('pick-B').addEventListener('click', () => judgeSel('B'));
    document.getElementById('eq-btn').addEventListener('click', () => judgeSel('eq'));
  }

  /* ══ 모드 3: 같은 분수 찾기 ══ */
  function renderMatch() {
    const base = level === 'easy'
      ? pick([[1, 2], [1, 3], [1, 4], [2, 3]])
      : pick([[2, 3], [3, 4], [2, 5], [3, 5], [5, 6]]);
    const k = pick(level === 'easy' ? [2, 3] : [2, 3, 4]);
    const answer = [base[0] * k, base[1] * k];

    // 오답: 동치가 아닌 비슷한 분수들
    const wrongs = [];
    const tryW = f => {
      if (f[0] >= 1 && f[0] < f[1] && !sameVal(f, base) && !wrongs.some(w => w[0] === f[0] && w[1] === f[1])) wrongs.push(f);
    };
    tryW([answer[0] + 1, answer[1]]);
    tryW([answer[0] - 1, answer[1]]);
    tryW([answer[0], answer[1] + base[1]]);
    tryW([base[0] + 1, base[1] * k]);
    tryW([answer[0] + 2, answer[1]]);
    while (wrongs.length < 3) tryW([1 + irnd(11), 2 + irnd(11)]);

    const opts = [answer, ...wrongs.slice(0, 3)].sort(() => Math.random() - 0.5);
    let judged = false;

    const selSet = f => new Set(Array.from({ length: f[0] }, (_, i) => i));
    roundArea.innerHTML = `
      <div class="question">${fracHtml(base[0], base[1])} 와 같은 크기의 분수는?<br><span class="en">Which fraction equals ${base[0]}/${base[1]}?</span></div>
      <div id="pizza-box">${pizzaSvg(base[1], selSet(base), 190)}</div>
      <div class="btn-grid">
        ${opts.map((f, i) => `<button class="ans-btn" data-i="${i}">${f[0]}/${f[1]}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>`;

    roundArea.querySelectorAll('.ans-btn').forEach(b => b.addEventListener('click', () => {
      if (judged) return;
      judged = true;
      const f = opts[parseInt(b.dataset.i, 10)];
      const ok = sameVal(f, base);
      roundArea.querySelectorAll('.ans-btn').forEach(x => {
        x.disabled = true;
        if (sameVal(opts[parseInt(x.dataset.i, 10)], base)) x.classList.add('right');
      });
      if (!ok) b.classList.add('wrong');
      document.getElementById('feedback').innerHTML = ok
        ? `<div class="ok">✅ 정답! +10 · ${base[0]}/${base[1]} = ${answer[0]}/${answer[1]}</div>`
        : `<div class="no">❌ 정답은 ${answer[0]}/${answer[1]} 이에요</div>`;
      finishRound(ok, 10);
    }));
  }

  /* ── 시작/종료 ── */
  function startGame() {
    round = 0; score = 0; correctCount = 0;
    updateStats();
    document.getElementById('round').textContent = 1;
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    renderRound();
  }

  function gameOver() {
    const key = `${mode}_${level}`;
    const stats = loadStats();
    stats.best = stats.best || {};
    const prevBest  = stats.best[key] || 0;
    const newRecord = correctCount > 0 && score > prevBest;
    if (newRecord) stats.best[key] = score;
    stats.totalCorrect = (stats.totalCorrect || 0) + correctCount;
    stats.totalGames   = (stats.totalGames   || 0) + 1;
    saveStats(stats);

    document.getElementById('final-mode').textContent    = `${MODE_LABEL[mode]} · ${LEVEL_LABEL[level]}`;
    document.getElementById('final-score').textContent   = score;
    document.getElementById('final-correct').textContent = correctCount + ' / ' + TOTAL_ROUNDS;
    document.getElementById('final-best').textContent    = Math.max(prevBest, score);
    document.getElementById('final-total').textContent   = stats.totalCorrect + '개';
    document.getElementById('record-badge').classList.toggle('show', newRecord);

    const emoji = correctCount >= 9 ? '🏆' : correctCount >= 6 ? '🌟' : '🍕';
    const title = correctCount >= 9 ? '분수 마스터!' : correctCount >= 6 ? '잘했어요!' : '영업 끝!';
    const titleEn = correctCount >= 9 ? 'Fraction Master!' : correctCount >= 6 ? 'Great Job!' : 'Closing Time';
    document.getElementById('over-emoji').textContent    = emoji;
    document.getElementById('over-title').textContent    = title;
    document.getElementById('over-title-en').textContent = titleEn;
    roundArea.innerHTML = '';
    overOverlay.classList.remove('hidden');
  }

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('retry-btn').addEventListener('click', () => {
    overOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
